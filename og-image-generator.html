<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; gap: 24px; }

  #og {
    width: 1200px;
    height: 630px;
    background: #0D1B2A;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
  }

  #scale-wrap {
    transform: scale(0.6);
    transform-origin: top center;
    margin-bottom: -252px;
  }

  #save-btn {
    background: #C9A84C;
    color: #0D1B2A;
    border: none;
    padding: 14px 40px;
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    border-radius: 4px;
  }
  #save-btn:hover { background: #E8C96A; }
  #status { color: rgba(255,255,255,0.45); font-family: 'DM Sans', sans-serif; font-size: 14px; }
</style>
</head>
<body>

<div id="scale-wrap">
  <div id="og">
    <!--
      Original logo SVG: viewBox="0 0 170 46"
      Polyline: 44,34  65,24  80,30  100,12  118,20  148,6
      Diamond polygon: 148,2 152,6 148,10 144,6
      PINNACLE text: x=44 y=30, Arial, size=15, weight=700, letter-spacing=1
      Underline: x1=44 y1=35 x2=138 y2=35, stroke=#C9A84C, width=0.8
      CONTENT CO.: x=44 y=44, Arial, size=6, letter-spacing=3

      Scale: 8x  (170*8=1360 — we'll center it)
      tx = (1200 - 170*8) / 2 = (1200-1360)/2 = -80 → shift right so logo sits nicely
      Let's use scale=6, tx = (1200 - 170*6)/2 = (1200-1020)/2 = 90
      ty: original content spans y=2 to y=44, center vertically
      OG center y = 315, logo center in original = (2+44)/2 = 23, scaled = 23*6=138
      ty = 315 - 138 = 177
      But we want logo a bit above center to leave room for tagline below
      ty = 230 - 23*6 = 230 - 138 = 92  → logo block top at 92+(2*6)=104, bottom at 92+(44*6)=356
      Tagline sits at ~430
    -->
    <svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="cg" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#8a6820"/>
          <stop offset="60%" stop-color="#C9A84C"/>
          <stop offset="100%" stop-color="#E8C96A"/>
        </linearGradient>
      </defs>

      <!-- Corner brackets -->
      <path d="M40,150 L40,40 L150,40" fill="none" stroke="rgba(201,168,76,0.28)" stroke-width="1.5"/>
      <path d="M1160,480 L1160,590 L1050,590" fill="none" stroke="rgba(201,168,76,0.28)" stroke-width="1.5"/>

      <!-- Exact logo scaled 6x, positioned tx=90, ty=92 -->
      <g transform="translate(90, 92) scale(6)">
        <!-- Exact polyline from source -->
        <polyline
          points="44,34 65,24 80,30 100,12 118,20 148,6"
          fill="none"
          stroke="url(#cg)"
          stroke-width="1.8"
          stroke-linejoin="round"
          stroke-linecap="round"
        />
        <!-- Exact diamond from source -->
        <polygon points="148,2 152,6 148,10 144,6" fill="#C9A84C"/>

        <!-- PINNACLE — exact from source: x=44 y=30, Arial, size=15, weight=700, letter-spacing=1 -->
        <text x="44" y="30"
          font-family="Arial, sans-serif"
          font-size="15"
          font-weight="700"
          fill="#FFFFFF"
          letter-spacing="1">PINN<tspan fill="#C9A84C">A</tspan>CLE</text>

        <!-- Underline — exact from source: x1=44 y1=35 x2=138 y2=35 -->
        <line x1="44" y1="35" x2="138" y2="35" stroke="#C9A84C" stroke-width="0.8"/>

        <!-- CONTENT CO. — exact from source: x=44 y=44, size=6, letter-spacing=3 -->
        <text x="44" y="44"
          font-family="Arial, sans-serif"
          font-size="6"
          fill="#C9A84C"
          letter-spacing="3">CONTENT CO.</text>
      </g>

      <!-- Tagline row below logo — logo bottom = 92 + 44*6 = 356, tagline at ~430 -->
      <!-- Gold dash -->
      <line x1="310" y1="450" x2="370" y2="450" stroke="#C9A84C" stroke-width="1.5"/>
      <!-- Tagline text -->
      <text x="395" y="456"
        font-family="Arial, sans-serif"
        font-size="17"
        font-weight="400"
        fill="#C9A84C"
        letter-spacing="3">CONTENT FOR REGULATED AND HIGH-TRUST INDUSTRIES</text>

    </svg>
  </div>
</div>

<button id="save-btn" onclick="saveImage()">Download og-image.png</button>
<div id="status"></div>

<script>
function saveImage() {
  const btn = document.getElementById('save-btn');
  const status = document.getElementById('status');
  btn.textContent = 'Generating...';
  status.textContent = 'Rendering at full resolution...';

  html2canvas(document.getElementById('og'), {
    width: 1200,
    height: 630,
    scale: 1,
    useCORS: true,
    allowTaint: true,
    backgroundColor: '#0D1B2A',
    logging: false
  }).then(canvas => {
    const link = document.createElement('a');
    link.download = 'og-image.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    btn.textContent = 'Download og-image.png';
    status.textContent = 'Done! Upload to GitHub to replace the old og-image.png.';
  }).catch(e => {
    status.textContent = 'Error: ' + e.message;
    btn.textContent = 'Try again';
  });
}
</script>
</body>
</html>
